profiles:
  cam0:
    description: Left camera (CSI port 0)
    resolution:
    - 2304
    - 1296
    rotation: 0
    hflip: false
    vflip: false
    crop:
    - 2304
    - 2304
    offset_x: -251
    offset_y: 0
    awb_enable: true
    awb_mode: auto
    colour_gains:
    - 1
    - 1
    bitrate_mbps: 16.0
    h264_profile: baseline
    gop_frames: 60
    repeat_headers: true
    encode_size:
    - 1024
    - 1024
    encoder_threads: 4
  cam1:
    description: Right camera (CSI port 1)
    resolution:
    - 2304
    - 1296
    rotation: 0
    hflip: true
    vflip: false
    crop:
    - 2304
    - 2304
    offset_x: 0
    offset_y: 0
    awb_enable: true
    awb_mode: auto
    colour_gains:
    - 7.3
    - 1
    bitrate_mbps: 16.0
    h264_profile: baseline
    gop_frames: 60
    repeat_headers: true
    encode_size:
    - 1024
    - 1024
    encoder_threads: 4
calibration:
  chessboard:
    columns: 9
    rows: 6
    square_size_m: 0.024
  output_dir: data/calibration
  notes: 'Capture at least 30 well-lit views per camera covering the full FOV.

    Use `scripts/capture_calibration.py` with matching board settings above.

    '
